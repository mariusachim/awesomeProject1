name: Issue closeout

on:
  pull_request:
    # Not pull_request_target: GitHub blocks it in public repos, and this workflow needs no secrets.
    # shortcut: a PR from a fork gets a read-only token, so its issue stays open; close that issue by hand.
    types: [opened, edited, reopened, synchronize, closed]

permissions: {}

jobs:
  check:
    # Make this job a required status check on the default branch, so a PR without the section cannot merge.
    name: issue-closeout-check
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/scripts/issue_closeout.py check

  close:
    name: issue-closeout-close
    if: github.event.action == 'closed' && github.event.pull_request.merged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/scripts/issue_closeout.py close
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
