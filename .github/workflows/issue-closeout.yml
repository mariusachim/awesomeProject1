name: Issue closeout

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  # pull_request_target runs this file and the script from the base branch, so a PR cannot change them,
  # and it gets a token that can write to issues also for a PR from a fork. Nothing from the PR is checked out.
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  check:
    # Make this job a required status check on the default branch, so a PR without the section cannot merge.
    name: issue-closeout-check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - run: python3 .github/scripts/issue_closeout.py check

  close:
    name: issue-closeout-close
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - run: python3 .github/scripts/issue_closeout.py close
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
