name: implement

# Reusable: feature-factory.yml and feature-listener.yml call it.
# No concurrency group here: the callers hold "feature-pipeline", and the same group here would deadlock.
on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # setup-uv has no major tag (v10) since v8, only full tags.
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install crapper, dryer and mutator (pinned)
        run: |
          crapper="git+https://github.com/unclebob/crapper@6fd92c4c9bcc56efb64a2f8743d5a2993bcfd42d"
          uv tool install "$crapper"
          uv tool install "git+https://github.com/unclebob/dryer@66ff6d21a42c04afcad89c78a80066176d1294b0"
          uv tool install "git+https://github.com/unclebob/mutator@a5a0cb803b66e0cdb8bf471b3b08af701d424a41" --with "$crapper"
      # Same pick as step 1 of the implement-feature skill: the oldest open feature issue without needs-human.
      - name: Find the feature issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --label feature --state open --json number,labels \
            --jq '[.[] | select(all(.labels[]; .name != "needs-human"))] | min_by(.number) | .number // empty')
          echo "number=$n" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: /implement-feature
          claude_args: >-
            --max-turns 200
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git *),Bash(gh *),Bash(npm *),Bash(npx *),Bash(crapper *),Bash(dryer *),Bash(mutator *)"
      # total_cost_usd is the number that /cost shows: tokens at API list prices, subagents included.
      # It runs also when the implementer fails, because that run costs money too.
      - name: Post the token cost on the issue
        if: ${{ !cancelled() && steps.issue.outputs.number != '' && steps.claude.outputs.execution_file != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.issue.outputs.number }}
          RESULT: ${{ steps.claude.outputs.execution_file }}
        run: |
          cost=$(jq '[.[] | select(.type == "result")][-1].total_cost_usd // empty' "$RESULT")
          [ -n "$cost" ] || exit 0
          # modelUsage has one key per model of the run, subagents included.
          models=$(jq -r '[.[] | select(.type == "result")][-1].modelUsage // {} | keys | join(", ")' "$RESULT")
          # shortcut: the subscription line assumes claude_code_oauth_token above; change it if the job moves to an API key.
          gh issue comment "$ISSUE" --body "$(printf 'Token cost of the implementer run: $%.2f\nModel: %s\nPaid by the Claude subscription: the cost is the tokens at API list prices, not a bill.' "$cost" "${models:-unknown}")"
