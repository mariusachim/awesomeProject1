name: feature-factory

on:
  # A Claude routine dispatches this workflow at HH:15 of the even hours UTC. See CLAUDE.md.
  workflow_dispatch:

concurrency:
  group: feature-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        # Agent telemetry goes to Grafana Cloud. It is off while the OTEL_EXPORTER_OTLP_* secrets are unset.
        env:
          CLAUDE_CODE_ENABLE_TELEMETRY: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT && '1' || '0' }}
          OTEL_METRICS_EXPORTER: otlp
          OTEL_LOGS_EXPORTER: otlp
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          OTEL_LOG_USER_PROMPTS: 1
          OTEL_LOG_TOOL_DETAILS: 1
          OTEL_RESOURCE_ATTRIBUTES: github.job=${{ github.job }},github.run_id=${{ github.run_id }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: /propose-feature
          # The issue-closeout hook prices the session with the ponytail plugin.
          plugin_marketplaces: https://github.com/DietrichGebert/ponytail.git
          plugins: ponytail@ponytail
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git *),Bash(gh *)"

  implement:
    needs: propose
    uses: ./.github/workflows/implement.yml
    secrets: inherit
