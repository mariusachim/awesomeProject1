name: design-review

# The designer agent plays the live game on GitHub Pages and files one UI/UX improvement as an issue.
# Then the UX developer agent builds it.
on:
  # A Claude routine dispatches this workflow at HH:15 of the odd hours UTC. See CLAUDE.md.
  workflow_dispatch:

concurrency:
  group: design-review
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Create the ux-improvement label
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create ux-improvement --color 0e8a16 --description "UI/UX improvement proposed by the designer agent" --force
      # Playwright MCP drives the Google Chrome that ubuntu-latest has. The pin is a release at least two weeks old.
      - uses: anthropics/claude-code-action@v1
        # Agent telemetry goes to Grafana Cloud. It is off while the OTEL_EXPORTER_OTLP_* secrets are unset.
        env:
          CLAUDE_CODE_ENABLE_TELEMETRY: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT && '1' || '0' }}
          OTEL_METRICS_EXPORTER: otlp
          OTEL_LOGS_EXPORTER: otlp
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          OTEL_LOG_USER_PROMPTS: 1
          OTEL_LOG_TOOL_DETAILS: 1
          OTEL_RESOURCE_ATTRIBUTES: github.job=${{ github.job }},github.run_id=${{ github.run_id }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: /review-design
          claude_args: >-
            --max-turns 100
            --mcp-config '{"mcpServers":{"playwright":{"command":"npx","args":["-y","@playwright/mcp@0.0.83","--headless","--isolated"]}}}'
            --allowedTools "Read,Glob,Grep,Bash(gh issue list *),Bash(gh issue view *),Bash(gh issue create *),mcp__playwright"

  improve:
    needs: review
    # The UX developer changes code and merges to main, so it waits for the feature pipeline.
    concurrency:
      group: feature-pipeline
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: ./.github/workflows/implement.yml
    with:
      skill: /improve-ux
      label: ux-improvement
    secrets: inherit
